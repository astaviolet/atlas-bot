name: Atlas no ar

# Por que tres gatilhos:
#   workflow_dispatch  -> voce liga/desliga na mao pela aba Actions
#   push               -> codigo novo no ar automaticamente
#   schedule           -> o runner do Actions mata o job em 6h, entao a cada 5h
#                         uma execucao nova assume e a anterior e cancelada
#                         pela chave `concurrency` abaixo.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
  schedule:
    - cron: "0 */5 * * *"

# Uma instancia so. Quando uma execucao nova comeca, a antiga e derrubada -
# isso evita dois bots com o mesmo token disputando a mesma sessao do gateway.
concurrency:
  group: atlas-bot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Rodar suíte
        run: python -m pytest -q

  bot:
    name: Bot (turno de até 6h)
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # Unico segredo obrigatorio: o token do bot. Isso e exigencia do Discord,
      # nao do projeto - sem token nao ha como conectar. A camada de IA usa um
      # endpoint publico anonimo e nao precisa de chave nenhuma.
      # Imprime so o NOME do que falta; nenhum valor de segredo vai para o log.
      - name: Conferir segredos
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          if [ -z "$DISCORD_TOKEN" ]; then
            echo "::error::Falta o segredo DISCORD_TOKEN"
            echo "Crie em: Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          echo "DISCORD_TOKEN presente."

      - name: Conferir configuração
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          ATLAS_CONTROL_CHANNEL_ID: ${{ vars.ATLAS_CONTROL_CHANNEL_ID }}
        run: python main.py --check

      # Lista o pool do catalogo. Usa --pool em vez de --health de proposito:
      # sondar 12 rotas antes de subir gastaria a cota gratuita que o bot vai
      # precisar. A sondagem de verdade acontece no router, sob demanda.
      # Falha aqui (exit 3 = zero rotas) derruba o job, porque bot sem rota nao serve.
      - name: Conferir pool de IA
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: python main.py --pool

      - name: Rodar bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          ATLAS_CONTROL_CHANNEL_ID: ${{ vars.ATLAS_CONTROL_CHANNEL_ID }}
          PYTHONUNBUFFERED: "1"
          MAX_RUN_SECONDS: "20400"
        run: |
          chmod +x scripts/run_bot.sh
          ./scripts/run_bot.sh

      - name: Publicar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-logs-${{ github.run_id }}
          path: |
            logs/bot.log
            logs/audit.jsonl
          if-no-files-found: ignore
          retention-days: 7
